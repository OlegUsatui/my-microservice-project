replicaCount: 2

image:
  repository: 5983-5793-5226.dkr.ecr.us-west-2.amazonaws.com/lesson-7-ecr-rus01
  tag: "v1"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80

container:
  port: 8000

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

probes:
  liveness:
    path: "/"
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: "/"
    initialDelaySeconds: 10
    periodSeconds: 5

env:
  DJANGO_SETTINGS_MODULE: "project.settings"
  DEBUG: "false"
  ALLOWED_HOSTS: "*"
  # DATABASE_HOST: "db"
  # DATABASE_NAME: "app"
  # DATABASE_USER: "user"
  # DATABASE_PORT: "5432"
